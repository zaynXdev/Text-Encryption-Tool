<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Encryption Tool</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, button, textarea { display: block; margin: 10px 0; padding: 10px; width: 100%; }
    </style>
</head>
<body>
    <h1>Basic Encryption Test</h1>

    <input type="text" id="inputText" value="hello" placeholder="Enter text">

    <select id="algorithm">
        <option value="caesar">Caesar Cipher</option>
        <option value="base64">Base64</option>
    </select>

    <button onclick="encrypt()">Encrypt</button>
    <button onclick="decrypt()">Decrypt</button>

    <textarea id="output" placeholder="Result will appear here" readonly></textarea>

    <div id="status"></div>

    <script>
        function showStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }

        async function encrypt() {
            const text = document.getElementById('inputText').value;
            const algorithm = document.getElementById('algorithm').value;

            showStatus('Sending encrypt request...');

            try {
                const response = await fetch('/encrypt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text, algorithm: algorithm})
                });

                const data = await response.json();
                showStatus(`Response: ${response.status}`);

                if (data.encrypted_text) {
                    document.getElementById('output').value = data.encrypted_text;
                } else {
                    document.getElementById('output').value = 'Error: ' + data.error;
                }
            } catch (error) {
                showStatus('Error: ' + error);
            }
        }

        async function decrypt() {
            const text = document.getElementById('output').value;
            const algorithm = document.getElementById('algorithm').value;

            showStatus('Sending decrypt request...');

            try {
                const response = await fetch('/decrypt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({encrypted_text: text, algorithm: algorithm})
                });

                const data = await response.json();
                showStatus(`Response: ${response.status}`);

                if (data.decrypted_text) {
                    document.getElementById('inputText').value = data.decrypted_text;
                } else {
                    showStatus('Error: ' + data.error);
                }
            } catch (error) {
                showStatus('Error: ' + error);
            }
        }
    </script>
</body>
</html>
